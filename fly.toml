app = "tenk-legal-mcp"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[mounts]
  source = "tenk_legal_db"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Mindig újraindítja a gépet, bármilyen exit-kóddal áll le a PID 1
# (beleértve az exit 0-t, amit a cron-run.sh SIGTERM-je vált ki frissítés után).
[[restart]]
  policy = "always"
