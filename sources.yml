schema_version: "1.0"
mcp_name: "Hungarian Law MCP"
jurisdiction: "HU"

sources:
  - name: "Nemzeti Jogszabálytár (National Legislation Database)"
    authority: "Magyar Közlöny (Hungarian Official Gazette)"
    official_portal: "https://njt.hu"
    retrieval_method: "HTML_SCRAPE"
    update_frequency: "weekly"
    last_ingested: "2026-02-21"
    license_or_terms:
      type: "Official Hungarian legal text publication (see portal terms)"
      url: "https://njt.hu"
      summary: "Legislative texts are sourced from the official national legislation portal."
    coverage:
      scope: "Full indexed corpus of Hungarian statutes discoverable via njt.hu simple search (author_type=törvény), including canonical curated statutes and discovered hu-law-* records."
      limitations: "As of 2026-02-21, 4 legacy statutes expose no extractable body text in public njt.hu HTML and are stored as metadata-only records (no fabricated provisions). Some canonical statutes are represented under stable curated MCP IDs with hu-law-* metadata aliases."
    languages:
      - "hu"
      - "en"

  - name: "Nemzeti Jogszabálytár — Kormányrendeletek (Government Decrees)"
    authority: "Magyar Közlöny (Hungarian Official Gazette)"
    official_portal: "https://njt.jog.gov.hu/eli"
    retrieval_method: "HTML_SCRAPE_ELI"
    update_frequency: "weekly"
    last_ingested: "2026-06-10"
    license_or_terms:
      type: "Official Hungarian legal text publication (see portal terms)"
      url: "https://njt.hu"
      summary: "Government decree texts sourced from the official national legislation portal via ELI endpoint."
    coverage:
      scope: "Full corpus of hatályos (in-force) Korm. rendeletek (government decrees), 1990–present (2495 decrees, 48546 provisions as of 2026-06-10). Discovered via /eli/R/{year}/Korm endpoint. Repeal detection is footnote-subject based ('A rendelet(et) a/az … hatályon kívül helyezte / hatályát vesztette'), which correctly excludes self-deregulated decrees (Jat. 12/B automatic deregulation) and keeps decrees that only carry section-level repeal notes. Stored as statute-type records with hu-decree-Korm-{year}-{sr} IDs. Weekly cron refreshes current year + previous year with status re-evaluation (year seeds deleted and re-ingested, not resumed)."
      limitations: "Only in-force decrees loaded (--decrees-in-force-only). Repealed decrees are excluded. 3 metadata-only records (1991-143, 1995-21, 1999-119 — amending decrees with no extractable body text). Decrees repealed mid-year outside the current+previous-year cron window are only re-classified on a full re-ingest."
    languages:
      - "hu"

data_freshness:
  automated_checks: true
  check_frequency: "weekly"
  last_verified: "2026-06-10"
